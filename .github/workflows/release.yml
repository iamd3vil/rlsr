name: Release

on:
  push:
    tags:
      - "v*"
  # Manual runs build and package everything but never publish.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Each target builds on its own runner with `rlsr --split`; the release job
  # merges the results with `rlsr --merge`. The action installs the latest
  # released rlsr.
  build:
    strategy:
      matrix:
        include:
          - name: linux
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - name: windows
            target: x86_64-pc-windows-gnu
            runner: ubuntu-latest
          # Linking for macOS needs the macOS SDK.
          - name: macos
            target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-zigbuild

      # rlsr.yml builds macOS with `just cargo-macos`.
      - name: Install just
        if: runner.os == 'macOS'
        uses: taiki-e/install-action@just

      - name: Build and package
        uses: ./.github/actions/rlsr
        with:
          args: --split --targets ${{ matrix.target }}

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - name: Checksum and publish
        uses: ./.github/actions/rlsr
        with:
          publish: ${{ github.event_name == 'push' }}
          args: --merge
          github_token: ${{ secrets.GITHUB_TOKEN }}
