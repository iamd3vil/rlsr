name: Nightly

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Skip the builds when the nightly tag already points at HEAD.
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compare the nightly tag with HEAD
        id: check
        run: |
          nightly="$(git rev-parse --quiet --verify 'refs/tags/nightly^{commit}' || true)"
          if [ "$nightly" = "$(git rev-parse HEAD)" ]; then
            echo "The nightly tag already points at HEAD; nothing to build."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Same split builds as the release workflow, but rlsr runs from this commit,
  # so each nightly is built with its own code.
  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    strategy:
      matrix:
        include:
          - name: linux
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - name: linux-arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
          - name: windows
            target: x86_64-pc-windows-gnu
            runner: ubuntu-latest
          # Linking for macOS needs the macOS SDK.
          - name: macos
            target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-zigbuild

      # rlsr.yml builds macOS with `just cargo-macos`.
      - name: Install just
        if: runner.os == 'macOS'
        uses: taiki-e/install-action@just

      - name: Build and package
        run: cargo run --release --locked -- --nightly --split --skip-publish --targets ${{ matrix.target }}

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      # Publish with the Linux binary this workflow just built.
      - name: Checksum and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x dist/rlsr-nightly-linux-x86_64
          dist/rlsr-nightly-linux-x86_64 --nightly --merge
